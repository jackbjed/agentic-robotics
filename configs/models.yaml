# Model APIs the world server may call for a skill program (perception/vlm.py). Keys: configs/local.yaml
# secrets.*_key_file (never in a sandbox, never logged).
models:
  astra:
    provider: openai_responses
    model: gpt-6-astra
    effort: medium
    max_output_tokens: 6000
    # $ per million tokens: panda_twin astra_e2e.py's table (an upper bound: uncached input billed as cache writes);
    # not re-checked against the provider's current prices
    price_per_mtok: {in: 12.5, cached: 1.0, out: 50.0}
  astra62:
    provider: openai_responses
    model: gpt-6.2-astra          # 2026-11-21: the provider's most capable model (its models page); no "Luna 6.2" exists
    effort: medium
    max_output_tokens: 6000
    price_per_mtok: {in: 8.0, cached: 0.4, out: 40.0}     # the provider's pricing page, 2026-11-21
budget:
  total_usd: 102.0    # hard cap on ALL model spending by this repository (runs/budget/openai.jsonl): $12.63 spent on
                      # the first key ($20 credit, 11-18 to 11-20) + $48.71 on the second ($50 credit on 2026-11-20,
                      # refilled; 2026-11-22: +5.4 for a $15 session the user approved with a refill) = $61.34;
                      # 2026-11-22: a third key ($68 credit, configs/local.yaml) and a $40 session the user approved
                      # (picking from clutter, with model calls inside the episodes) + $0.66 for its checks
                      # (ledger $97.08 after it); 2026-11-23: that session's evaluation, which the user approved
                      # ($36 left on the third key): 200 episodes whose program calls the model, run under a cap of
                      # 110.0, cost $4.90 (ledger $101.98); the cap is back at what is spent: raise it for a new run
