# The clutter-pick scenes: layout banks of panda_pick_rgbd (assets/manifest.yaml clutter_layouts). A layout = the
# target tape roll (red or yellow), the other roll and 1-3 more objects, settled; the arm's start pose over the
# target (+-6 cm, fingertips 20-26 cm up, any closing direction). Level = gap between the target's outline and the
# others': L0 6-10 cm, L1 3.5-6 cm, L2 1.5-3.5 cm, L3 boxed in (2-12 mm all round, no free straight-down grasp).
banks: data/layouts                  # {split}_L{level}.jsonl
splits: {train: 2000, val: 100, test: 200}   # layouts per level (bank seeds 101 / 202 / 303)
levels: [0, 1, 2, 3]
episode_seed: "seed * 1000003 + level * 10007 + idx"   # the reset seed (sensor noise, calibration error, lights)
