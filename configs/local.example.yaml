# Machine-local settings. Copy to configs/local.yaml (gitignored) and fill in. Nothing here is committed.
roots:                       # asset roots named in assets/manifest.yaml
  deoxys: /path/to/deoxys
  panda_twin: /path/to/panda_twin
  panda_pick_rgbd: /path/to/panda_pick_rgbd
render:
  egl_device: 1              # MUJOCO_EGL_DEVICE_ID for the world server (NB: EGL ids may be swapped vs nvidia-smi)
secrets:                     # files, never values
  openai_key_file: null
  gemini_key_file: null
  claude_oauth_token_file: null   # optional long-lived token (claude setup-token); else the CLI's own login
